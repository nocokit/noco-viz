<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="audio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#252629;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#audio-bg)"/>

  <!-- 音频波形图标 -->
  <g transform="translate(200, 150)">
    <rect x="-50" y="-8" width="8" height="40" rx="4" fill="#f59e0b" opacity="0.4"/>
    <rect x="-35" y="-20" width="8" height="60" rx="4" fill="#f59e0b" opacity="0.5"/>
    <rect x="-20" y="-5" width="8" height="30" rx="4" fill="#f59e0b" opacity="0.4"/>
    <rect x="-5" y="-25" width="8" height="70" rx="4" fill="#f59e0b" opacity="0.6"/>
    <rect x="10" y="-15" width="8" height="50" rx="4" fill="#f59e0b" opacity="0.5"/>
    <rect x="25" y="-10" width="8" height="45" rx="4" fill="#f59e0b" opacity="0.4"/>
    <rect x="40" y="-18" width="8" height="55" rx="4" fill="#f59e0b" opacity="0.5"/>

    <text y="70" font-family="Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">
      音频
    </text>
  </g>
</svg>
