<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <defs>
    <linearGradient id="media-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2a2a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#media-bg)"/>

  <!-- 文件图标 -->
  <g transform="translate(200, 150)">
    <rect x="-40" y="-50" width="80" height="100" rx="8" fill="#404040" opacity="0.5"/>
    <path d="M -20 -50 L 20 -50 L 40 -30 L 40 50 L -40 50 L -40 -50 Z" fill="#505050" opacity="0.6"/>
    <path d="M 20 -50 L 20 -30 L 40 -30" fill="#404040" opacity="0.4"/>

    <!-- 文字 -->
    <text y="75" font-family="Arial, sans-serif" font-size="14" fill="#808080" text-anchor="middle">
      媒体文件
    </text>
  </g>
</svg>
