<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2b2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#bg-gradient)"/>

  <!-- 网格图案 -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#404040" stroke-width="0.5" opacity="0.2"/>
  </pattern>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- 中心图标 -->
  <g transform="translate(400, 225)">
    <!-- 图表图标 -->
    <rect x="-80" y="-60" width="160" height="120" rx="12" fill="url(#icon-gradient)" opacity="0.2"/>

    <!-- 柱状图 -->
    <rect x="-60" y="-20" width="20" height="40" rx="4" fill="#3b82f6" opacity="0.5"/>
    <rect x="-30" y="-35" width="20" height="55" rx="4" fill="#8b5cf6" opacity="0.5"/>
    <rect x="0" y="-45" width="20" height="65" rx="4" fill="#3b82f6" opacity="0.5"/>
    <rect x="30" y="-25" width="20" height="45" rx="4" fill="#8b5cf6" opacity="0.5"/>

    <!-- 文字 -->
    <text x="0" y="60" font-family="Arial, sans-serif" font-size="16" fill="#6b7280" text-anchor="middle">
      模板缩略图
    </text>
  </g>

  <!-- 装饰元素 -->
  <circle cx="100" cy="100" r="40" fill="#3b82f6" opacity="0.05"/>
  <circle cx="700" cy="350" r="50" fill="#8b5cf6" opacity="0.05"/>
  <circle cx="650" cy="100" r="30" fill="#3b82f6" opacity="0.05"/>
  <circle cx="150" cy="350" r="35" fill="#8b5cf6" opacity="0.05"/>
</svg>
