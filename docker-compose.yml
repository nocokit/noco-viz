version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: noco-viz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: noco_viz_db
      MYSQL_USER: noco_user
      MYSQL_PASSWORD: noco_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - noco-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: noco-viz-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: noco_user
      DB_PASSWORD: noco_pass
      DB_DATABASE: noco_viz_db
      JWT_SECRET: your-super-secret-jwt-key
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./backend-node/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - noco-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
    container_name: noco-viz-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - noco-network

volumes:
  mysql_data:
    driver: local

networks:
  noco-network:
    driver: bridge
