<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1d21;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2e33;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#333" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.2"/>
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="24" fill="#3b82f6" text-anchor="middle" dy=".3em">NocoViz Project</text>
</svg>